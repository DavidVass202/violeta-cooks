<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Violeta Cooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,800&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5eef9;
    --bg-card: #fbf6fe;
    --ink: #2a1f3d;
    --ink-soft: #5e4f76;
    --ink-faded: #9486a8;
    --accent: #9d6fc7;
    --accent-deep: #6b4490;
    --lavender: #b89cd9;
    --rose: #d4a5c9;
    --sage: #a8b89c;
    --gold: #c9a96e;
    --line: #e2d4ee;
    --carb: #c9a96e;
    --protein: #9d6fc7;
    --fat: #a8b89c;
    --sidebar-width: 260px;
    --sidebar-collapsed-width: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Inter Tight', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    overflow: hidden;
    position: relative;
  }

  /* Subtle floral background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(157, 111, 199, 0.06) 0%, transparent 35%),
      radial-gradient(circle at 85% 75%, rgba(212, 165, 201, 0.05) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(184, 156, 217, 0.03) 0%, transparent 50%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><g fill='none' stroke='%23b89cd9' stroke-width='0.6' opacity='0.18'><g transform='translate(40 50)'><circle cx='0' cy='-8' r='5'/><circle cx='7.6' cy='-2.5' r='5'/><circle cx='4.7' cy='6.5' r='5'/><circle cx='-4.7' cy='6.5' r='5'/><circle cx='-7.6' cy='-2.5' r='5'/><circle cx='0' cy='0' r='1.8' fill='%23c9a96e' stroke='none' opacity='0.8'/></g><g transform='translate(170 110)'><circle cx='0' cy='-6' r='4'/><circle cx='5.7' cy='-1.9' r='4'/><circle cx='3.5' cy='4.9' r='4'/><circle cx='-3.5' cy='4.9' r='4'/><circle cx='-5.7' cy='-1.9' r='4'/><circle cx='0' cy='0' r='1.4' fill='%23c9a96e' stroke='none' opacity='0.8'/></g><g transform='translate(90 180)'><circle cx='0' cy='-7' r='4.5'/><circle cx='6.7' cy='-2.2' r='4.5'/><circle cx='4.1' cy='5.7' r='4.5'/><circle cx='-4.1' cy='5.7' r='4.5'/><circle cx='-6.7' cy='-2.2' r='4.5'/><circle cx='0' cy='0' r='1.6' fill='%23c9a96e' stroke='none' opacity='0.8'/></g><g transform='translate(200 30)' opacity='0.7'><circle cx='0' cy='-5' r='3.5'/><circle cx='4.8' cy='-1.5' r='3.5'/><circle cx='3' cy='4' r='3.5'/><circle cx='-3' cy='4' r='3.5'/><circle cx='-4.8' cy='-1.5' r='3.5'/></g><g transform='translate(20 200)' opacity='0.7'><circle cx='0' cy='-5' r='3.5'/><circle cx='4.8' cy='-1.5' r='3.5'/><circle cx='3' cy='4' r='3.5'/><circle cx='-3' cy='4' r='3.5'/><circle cx='-4.8' cy='-1.5' r='3.5'/></g><path d='M 130 60 Q 138 65 135 75 Q 132 80 125 78' opacity='0.5'/><path d='M 60 130 Q 68 135 65 145 Q 62 150 55 148' opacity='0.5'/></g></svg>");
    background-repeat: repeat;
    background-size: 240px 240px, 240px 240px, 100% 100%, 240px 240px;
  }

  .app {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr;
    height: 100vh;
    transition: grid-template-columns 0.3s ease;
    position: relative;
    z-index: 1;
  }

  .app.collapsed { grid-template-columns: var(--sidebar-collapsed-width) 1fr; }

  .sidebar {
    background: var(--bg-card);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    backdrop-filter: blur(8px);
  }

  .sidebar-toggle {
    position: absolute;
    top: 18px;
    right: 12px;
    z-index: 10;
    background: var(--bg-card);
    border: 1px solid var(--line);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 12px;
    transition: all 0.2s;
  }

  .sidebar-toggle:hover {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .app.collapsed .sidebar-toggle { right: 50%; transform: translateX(50%); }

  .sidebar-content {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
    opacity: 1;
    transition: opacity 0.2s;
  }

  .app.collapsed .sidebar-content { opacity: 0; pointer-events: none; }

  .brand {
    padding: 22px 22px 16px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }

  .brand::after {
    content: '';
    position: absolute;
    right: 52px;
    top: 22px;
    width: 22px;
    height: 22px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239d6fc7' stroke-width='1.2' opacity='0.6'><circle cx='12' cy='6' r='3'/><circle cx='17.2' cy='9.6' r='3'/><circle cx='15.3' cy='15.8' r='3'/><circle cx='8.7' cy='15.8' r='3'/><circle cx='6.8' cy='9.6' r='3'/><circle cx='12' cy='11' r='1.2' fill='%23c9a96e' stroke='none'/></svg>");
    background-repeat: no-repeat;
  }

  .brand-mark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: 6px;
  }

  .brand-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-style: italic;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--ink-faded);
    margin-top: 4px;
  }

  .search-row {
    padding: 14px 22px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search {
    flex: 1;
    position: relative;
    min-width: 0;
  }

  .search input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 6px 0 6px 20px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  .search input:focus { border-bottom-color: var(--accent); }
  .search input::placeholder { color: var(--ink-faded); }

  .search::before {
    content: '⌕';
    position: absolute;
    left: 0;
    top: 5px;
    color: var(--ink-faded);
    font-size: 16px;
  }

  .search-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .tags {
    padding: 10px 22px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    border-bottom: 1px solid var(--line);
  }

  .tag-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid var(--line);
    border-radius: 100px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.2s;
  }

  .tag-chip:hover { border-color: var(--accent); color: var(--accent-deep); }
  .tag-chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .recipe-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }

  .recipe-list::-webkit-scrollbar { width: 4px; }
  .recipe-list::-webkit-scrollbar-track { background: transparent; }
  .recipe-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .recipe-item {
    padding: 12px 22px;
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
  }

  .recipe-item:hover { background: rgba(157, 111, 199, 0.05); }
  .recipe-item.active {
    border-left-color: var(--accent);
    background: rgba(157, 111, 199, 0.08);
  }

  .recipe-item-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-faded);
    letter-spacing: 0.1em;
  }

  .recipe-item-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15px;
    line-height: 1.25;
    margin-top: 2px;
    letter-spacing: -0.01em;
  }

  .recipe-item-meta {
    font-size: 10px;
    color: var(--ink-faded);
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }

  .btn-add {
    background: var(--accent);
    color: white;
    border: none;
    width: 28px;
    height: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
  }

  .btn-add:hover { background: var(--accent-deep); }

  .btn-export {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    width: 28px;
    height: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
  }

  .btn-export:hover {
    border-color: var(--accent);
    color: var(--accent-deep);
  }

  .main {
    overflow-y: auto;
    position: relative;
  }

  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

  .recipe {
    max-width: 920px;
    margin: 0 auto;
    padding: 56px 72px 100px;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .recipe-header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 32px;
    margin-bottom: 36px;
    position: relative;
  }

  .recipe-eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: 14px;
  }

  .recipe-eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .recipe-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 56px;
    line-height: 0.98;
    letter-spacing: -0.03em;
    margin-bottom: 14px;
    color: var(--ink);
  }

  .recipe-description {
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 620px;
    margin-bottom: 28px;
    font-family: 'Fraunces', serif;
    font-weight: 300;
  }

  .recipe-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding-top: 4px;
  }

  .stat {
    border-left: 2px solid var(--accent);
    padding-left: 12px;
  }

  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: 4px;
  }

  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .stat-value small {
    font-size: 12px;
    color: var(--ink-faded);
    font-weight: 400;
    margin-left: 2px;
  }

  .macros {
    margin-top: 24px;
    padding: 18px 20px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  .macros-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .macros-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faded);
  }

  .macros-target {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-faded);
    letter-spacing: 0.05em;
  }

  .macros-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .macro {
    display: flex;
    flex-direction: column;
  }

  .macro-bar {
    height: 5px;
    background: rgba(42, 31, 61, 0.06);
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .macro-bar-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 0.5s ease;
  }

  .macro-carb .macro-bar-fill { background: var(--carb); }
  .macro-protein .macro-bar-fill { background: var(--protein); }
  .macro-fat .macro-bar-fill { background: var(--fat); }

  .macro-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .macro-values {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .macro-grams {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--ink);
  }

  .macro-grams small {
    font-size: 11px;
    color: var(--ink-faded);
    font-weight: 400;
  }

  .macro-pct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faded);
    letter-spacing: 0.05em;
  }

  .servings-control {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 16px 20px;
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 4px;
  }

  .servings-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .servings-buttons {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .serv-btn {
    width: 30px;
    height: 30px;
    border: 1px solid var(--line);
    background: transparent;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    border-radius: 50%;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .serv-btn:hover:not(:disabled) {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .serv-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .serv-count {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    min-width: 40px;
    text-align: center;
  }

  .recipe-body {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 52px;
  }

  .section-heading {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .section-heading .count { color: var(--ink-faded); }

  .ing-group { margin-bottom: 24px; }

  .ing-group-title {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    color: var(--accent-deep);
    margin-bottom: 8px;
    font-weight: 500;
    font-style: italic;
  }

  .ing-list { list-style: none; }

  .ing-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px dotted var(--line);
    font-size: 14px;
  }

  .ing-item:last-child { border-bottom: none; }

  .ing-amount {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    min-width: 70px;
    font-size: 14px;
  }

  .ing-name {
    color: var(--ink-soft);
    flex: 1;
  }

  .step { margin-bottom: 28px; }

  .step-num {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 32px;
    color: var(--lavender);
    line-height: 1;
    margin-bottom: 6px;
    display: block;
    font-style: italic;
  }

  .step-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .step-body {
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.65;
  }

  .step-body strong {
    color: var(--accent-deep);
    font-weight: 600;
  }

  .notes {
    margin-top: 52px;
    padding: 24px 28px;
    background: linear-gradient(135deg, rgba(157, 111, 199, 0.08), rgba(212, 165, 201, 0.08));
    border-left: 3px solid var(--accent);
    border-radius: 4px;
  }

  .notes-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-deep);
    margin-bottom: 10px;
  }

  .notes-body {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-soft);
    font-weight: 400;
  }

  .subs {
    margin-top: 32px;
    padding: 24px 28px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  .subs-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .subs-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .subs-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px 28px;
  }

  @media (min-width: 700px) {
    .subs-grid { grid-template-columns: 1fr 1fr; }
  }

  .sub-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.4fr);
    align-items: baseline;
    gap: 8px;
    padding: 8px 0;
    font-size: 14px;
    line-height: 1.5;
  }

  .sub-from {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--ink);
  }

  .sub-arrow {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-size: 13px;
  }

  .sub-to {
    color: var(--ink-soft);
  }

  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 40px;
    color: var(--ink-faded);
  }

  .empty-mark {
    width: 110px;
    height: 110px;
    margin-bottom: 14px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e2d4ee' stroke-width='0.8'><circle cx='12' cy='6' r='3'/><circle cx='17.2' cy='9.6' r='3'/><circle cx='15.3' cy='15.8' r='3'/><circle cx='8.7' cy='15.8' r='3'/><circle cx='6.8' cy='9.6' r='3'/><circle cx='12' cy='11' r='1.4' fill='%23e2d4ee' stroke='none'/></svg>");
    background-repeat: no-repeat;
    background-size: contain;
  }

  .empty p {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-style: italic;
  }

  .recipe-tags {
    display: flex;
    gap: 5px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .recipe-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 9px;
    background: var(--accent);
    color: white;
    border-radius: 100px;
  }

  .recipe-tag.rose { background: var(--rose); }
  .recipe-tag.sage { background: var(--sage); }
  .recipe-tag.gold { background: var(--gold); }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(42, 31, 61, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .modal-bg.show { display: flex; }

  .modal {
    background: var(--bg-card);
    width: 90%;
    max-width: 720px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 36px;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(42, 31, 61, 0.25);
  }

  .modal h2 {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
    font-weight: 500;
    color: var(--ink);
    font-style: italic;
  }

  .modal p.modal-sub {
    color: var(--ink-faded);
    font-size: 13px;
    margin-bottom: 24px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  .form-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  .form-field { margin-bottom: 14px; }

  .form-field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .form-field input,
  .form-field textarea,
  .form-field select {
    width: 100%;
    background: white;
    border: 1px solid var(--line);
    padding: 9px 11px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-field input:focus,
  .form-field textarea:focus,
  .form-field select:focus {
    border-color: var(--accent);
  }

  .form-field textarea {
    min-height: 80px;
    resize: vertical;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
  }

  .form-field .hint {
    font-size: 11px;
    color: var(--ink-faded);
    margin-top: 4px;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }

  .btn {
    padding: 9px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
    border: 1px solid transparent;
  }

  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-deep); }

  .btn-secondary {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--line);
  }

  .btn-secondary:hover { border-color: var(--accent); color: var(--accent-deep); }

  .btn-danger {
    background: transparent;
    color: var(--accent-deep);
    border-color: var(--accent-deep);
    margin-right: auto;
  }

  .btn-danger:hover { background: var(--accent-deep); color: white; }

  .recipe-actions {
    position: absolute;
    top: 36px;
    right: 0;
    display: flex;
    gap: 8px;
    z-index: 2;
  }

  .icon-btn {
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.2s;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent-deep); }

  .icon-btn.cook-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-size: 11px;
    padding-left: 2px;
  }

  .icon-btn.cook-btn:hover {
    background: var(--accent-deep);
    border-color: var(--accent-deep);
  }

  .icon-btn.edit-btn {
    background: var(--rose);
    border-color: var(--rose);
    color: white;
  }

  .icon-btn.edit-btn:hover {
    background: #b8869f;
    border-color: #b8869f;
  }

  .loading {
    padding: 40px;
    text-align: center;
    color: var(--ink-faded);
  }

  .shopping {
    margin-top: 32px;
    padding: 24px 28px;
    background: linear-gradient(135deg, rgba(157, 111, 199, 0.05), rgba(184, 156, 217, 0.04));
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  .shopping-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .shopping-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .shopping-label .count {
    color: var(--ink-faded);
    font-size: 9px;
    letter-spacing: 0.1em;
  }

  .shopping-list {
    list-style: none;
    columns: 2;
    column-gap: 36px;
  }

  .shopping-list li {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 7px 0;
    font-size: 14px;
    border-bottom: 1px dotted var(--line);
    break-inside: avoid;
  }

  .shop-amount {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    min-width: 70px;
  }

  .shop-name {
    color: var(--ink-soft);
    flex: 1;
  }

  @media (max-width: 700px) {
    .shopping-list { columns: 1; }
  }

  .mobile-menu-btn {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 40;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg-card);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 10px rgba(42, 31, 61, 0.12);
    transition: all 0.2s;
  }

  .mobile-menu-btn:hover {
    border-color: var(--accent);
    color: var(--accent-deep);
  }

  .mobile-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(42, 31, 61, 0.4);
    z-index: 49;
    backdrop-filter: blur(3px);
  }

  @media (max-width: 700px) {
    .app,
    .app.collapsed {
      grid-template-columns: 1fr;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 280px;
      max-width: 85vw;
      z-index: 60;
      transform: translateX(0);
      transition: transform 0.3s ease;
    }

    .app.collapsed .sidebar {
      transform: translateX(-100%);
    }

    .app.collapsed .mobile-menu-btn {
      display: flex;
    }

    .app:not(.collapsed) .mobile-backdrop {
      display: block;
    }

    .recipe { padding: 28px 22px 80px; }
  }

  /* === Inline timer button === */
  .timer-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 100px;
    padding: 2px 10px 2px 8px;
    font-family: inherit;
    font-size: 0.92em;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    vertical-align: baseline;
    margin: 0 2px;
  }
  .timer-btn:hover { background: var(--accent-deep); }
  .timer-btn.running { background: var(--accent-deep); animation: pulse 2s ease-in-out infinite; }
  .timer-btn.done { background: var(--sage); animation: none; }
  .timer-btn::before { content: '⏱'; font-size: 0.85em; margin-right: 2px; }
  .timer-btn.running::before { content: '■'; }
  .timer-btn.done::before { content: '✓'; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(157, 111, 199, 0.5); }
    50% { box-shadow: 0 0 0 8px rgba(157, 111, 199, 0); }
  }

  /* === Timer popover === */
  .timer-popover {
    position: fixed;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px;
    box-shadow: 0 12px 40px rgba(42, 31, 61, 0.2);
    z-index: 600;
    width: 240px;
    display: none;
  }
  .timer-popover.show { display: block; }

  .timer-popover-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: 10px;
  }

  .timer-popover-fields {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }

  .timer-popover-fields input {
    width: 60px;
    background: white;
    border: 1px solid var(--line);
    padding: 8px 6px;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    text-align: center;
    color: var(--ink);
    border-radius: 3px;
    outline: none;
    -moz-appearance: textfield;
  }
  .timer-popover-fields input::-webkit-outer-spin-button,
  .timer-popover-fields input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .timer-popover-fields input:focus { border-color: var(--accent); }

  .timer-popover-fields .colon {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink-faded);
  }

  .timer-popover-fields label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faded);
    text-align: center;
    flex: 1;
  }

  .timer-popover-field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .timer-popover-actions {
    display: flex;
    gap: 6px;
  }
  .timer-popover-actions button {
    flex: 1;
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-radius: 3px;
    cursor: pointer;
  }
  .timer-popover-actions button:hover { background: var(--accent-deep); }
  .timer-popover-actions button.secondary {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .timer-popover-actions button.secondary:hover {
    border-color: var(--ink);
    color: var(--ink);
    background: transparent;
  }

  /* === Floating active timers tray === */
  .timer-tray {
    position: fixed;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 450;
    max-width: 260px;
  }

  .timer-tray-item {
    background: var(--accent);
    color: white;
    padding: 10px 14px;
    border-radius: 100px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 16px rgba(42, 31, 61, 0.25);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .timer-tray-item:hover { background: var(--accent-deep); }
  .timer-tray-item.done { background: var(--sage); animation: pulse 1s ease-in-out infinite; }
  .timer-tray-label {
    font-family: 'Inter Tight', sans-serif;
    font-size: 11px;
    opacity: 0.85;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .timer-tray-close {
    background: rgba(255,255,255,0.25);
    border: none;
    color: white;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .timer-tray-close:hover { background: rgba(255,255,255,0.4); }

  /* === "Start a timer" button === */
  .timer-start-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 100px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .timer-start-btn:hover {
    border-color: var(--accent);
    color: var(--accent-deep);
  }
  .timer-start-btn::before { content: '⏱'; font-size: 11px; }

  /* === Cook mode overlay === */
  .cook-mode {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 500;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .cook-mode.active { display: flex; }

  .cook-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-card);
  }

  .cook-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.01em;
    font-style: italic;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin: 0 14px;
  }

  .cook-close, .cook-wake {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .cook-close:hover, .cook-wake:hover {
    border-color: var(--accent);
    color: var(--accent-deep);
  }
  .cook-wake.on {
    background: var(--sage);
    color: white;
    border-color: var(--sage);
  }

  .cook-progress {
    height: 3px;
    background: var(--line);
    position: relative;
  }
  .cook-progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .cook-step {
    flex: 1;
    overflow-y: auto;
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .cook-step-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faded);
    margin-bottom: 18px;
  }

  .cook-step-title {
    font-family: 'Fraunces', serif;
    font-size: 42px;
    line-height: 1.05;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 28px;
    max-width: 700px;
  }

  .cook-step-body {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 22px;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 640px;
  }

  .cook-step-body strong {
    color: var(--accent-deep);
    font-weight: 600;
  }

  .cook-step-body .timer-btn {
    font-size: 0.85em;
    padding: 4px 14px 4px 12px;
  }

  .cook-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px 28px;
    gap: 14px;
    background: var(--bg-card);
    border-top: 1px solid var(--line);
  }

  .cook-nav-btn {
    flex: 1;
    background: var(--accent);
    color: white;
    border: none;
    padding: 18px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s;
  }
  .cook-nav-btn:hover:not(:disabled) { background: var(--accent-deep); }
  .cook-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .cook-nav-btn.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .cook-nav-btn.secondary:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent-deep);
    background: transparent;
  }
  .cook-nav-counter {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--ink-soft);
    min-width: 60px;
    text-align: center;
  }

  @media (max-width: 768px) {
    .cook-step { padding: 32px 22px; }
    .cook-step-title { font-size: 32px; margin-bottom: 22px; }
    .cook-step-body { font-size: 19px; }
    .cook-nav-btn { padding: 16px 18px; font-size: 10px; }
    .cook-header { padding: 14px 18px; }
    .cook-title { font-size: 15px; }
  }

  @media (max-width: 900px) {
    .recipe-body { grid-template-columns: 1fr; gap: 30px; }
    .recipe { padding: 36px 28px 80px; }
    .recipe-title { font-size: 40px; }
    .recipe-stats { grid-template-columns: repeat(2, 1fr); }
    .macros-grid { grid-template-columns: 1fr; gap: 12px; }
    .sub-item { grid-template-columns: 1fr; gap: 2px; }
    .sub-arrow { display: none; }
  }

</style>
</head>
<body>

<div class="app" id="app">
  <button class="mobile-menu-btn" id="mobileMenuBtn" title="Open menu" aria-label="Open menu">☰</button>
  <div class="mobile-backdrop" id="mobileBackdrop"></div>

  <aside class="sidebar">
    <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">‹</button>

    <div class="sidebar-content">
      <div class="brand">
        <div class="brand-mark">Volume 02</div>
        <div class="brand-title">Violeta Cooks</div>
        <div class="brand-sub">a working collection</div>
      </div>

      <div class="search-row">
        <div class="search">
          <input type="text" id="searchInput" placeholder="Search...">
        </div>
        <div class="search-actions">
          <button class="btn-add" onclick="openModal()" title="New recipe">+</button>
          <button class="btn-export" onclick="exportData()" title="Export all">↓</button>
        </div>
      </div>

      <div class="tags" id="tagFilters"></div>

      <div class="recipe-list" id="recipeList">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="timer-popover" id="timerPopover">
  <div class="timer-popover-label" id="timerPopoverLabel">Set timer</div>
  <div class="timer-popover-fields">
    <div class="timer-popover-field">
      <input type="number" id="timerH" min="0" max="23" value="0">
      <label>hr</label>
    </div>
    <span class="colon">:</span>
    <div class="timer-popover-field">
      <input type="number" id="timerM" min="0" max="59" value="0">
      <label>min</label>
    </div>
    <span class="colon">:</span>
    <div class="timer-popover-field">
      <input type="number" id="timerS" min="0" max="59" value="0">
      <label>sec</label>
    </div>
  </div>
  <div class="timer-popover-actions">
    <button class="secondary" onclick="closeTimerPopover()">Cancel</button>
    <button onclick="confirmTimerStart()">Start</button>
  </div>
</div>

<div class="timer-tray" id="timerTray"></div>

<div class="cook-mode" id="cookMode">
  <div class="cook-header">
    <button class="cook-close" onclick="exitCookMode()" title="Exit">✕</button>
    <div class="cook-title" id="cookTitle"></div>
    <button class="cook-wake" id="cookWake" onclick="toggleWakeLock()" title="Keep screen on">☀</button>
  </div>
  <div class="cook-progress"><div class="cook-progress-fill" id="cookProgressFill"></div></div>
  <div class="cook-step" id="cookStep"></div>
  <div class="cook-nav">
    <button class="cook-nav-btn secondary" id="cookPrev" onclick="cookStepChange(-1)">← Prev</button>
    <div class="cook-nav-counter" id="cookCounter"></div>
    <button class="cook-nav-btn" id="cookNext" onclick="cookStepChange(1)">Next →</button>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modalTitle">New Recipe</h2>
    <p class="modal-sub">Add a recipe. Use one ingredient per line.</p>

    <div class="form-field">
      <label>Title</label>
      <input type="text" id="f-title" placeholder="e.g. Spring Pea Risotto">
    </div>

    <div class="form-field">
      <label>Description</label>
      <input type="text" id="f-description" placeholder="A short line about the dish">
    </div>

    <div class="form-row">
      <div class="form-field">
        <label>Servings</label>
        <input type="number" id="f-servings" value="4" min="1">
      </div>
      <div class="form-field">
        <label>Total time (minutes)</label>
        <input type="number" id="f-time" value="40" min="1">
      </div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label>Calories per serving</label>
        <input type="number" id="f-calories" placeholder="kcal">
      </div>
      <div class="form-field">
        <label>Tags (comma separated)</label>

  async function loadRecipes() {
    let saved = null;
    try {
      const result = await window.storage.get(STORAGE_KEY);
      if (result && result.value) saved = JSON.parse(result.value);
    } catch (e) {}

    let deletedSeeds = [];
    try {
      const result = await window.storage.get(DELETED_SEEDS_KEY);
      if (result && result.value) deletedSeeds = JSON.parse(result.value);
    } catch (e) {}

    if (saved === null) {
      // First load: use all seeds
      recipes = [...SEED_RECIPES];
    } else {
      // Returning user: keep their data exactly as is, only add seed recipes they've never seen
      const savedIds = new Set(saved.map(r => r.id));
      const deletedSet = new Set(deletedSeeds);
      const newSeeds = SEED_RECIPES.filter(r => !savedIds.has(r.id) && !deletedSet.has(r.id));
      recipes = [...saved, ...newSeeds];
    }
    await saveAllRecipes();
  }


  async function saveAllRecipes() {

  }

  function calcMacroPercents(recipe) {
    const { protein, carbs, fat } = recipe;
    if (!protein || !carbs || !fat) {
      return { carb: null, protein: null, fat: null };
    }
    const carbCals = carbs * 4;
    const protCals = protein * 4;
    const fatCals = fat * 9;
    const total = carbCals + protCals + fatCals;
    return {
      carb: Math.round((carbCals / total) * 100),
      protein: Math.round((protCals / total) * 100),
      fat: Math.round((fatCals / total) * 100)
    };
  }

  function countIngredients(recipe) {
    return recipe.ingredientGroups.reduce((sum, g) => sum + g.items.length, 0);
  }

  function scaleAmount(amount, scale) {
    if (amount === '1' && scale === 1) return amount;
    const num = parseFloat(amount);
    if (isNaN(num)) return amount;
    const result = num * scale;
    if (Number.isInteger(result)) return String(result);
    if (result < 1) return result.toFixed(2).replace(/\.?0+$/, '');
    return result.toFixed(1).replace(/\.0$/, '');
  }

  function roundGrams(g) {
    if (g <= 0) return 0;
    if (g < 30) return Math.round(g / 5) * 5;
    if (g < 300) return Math.round(g / 10) * 10;
    return Math.round(g / 50) * 50;
  }

  function scaleSubstituteText(text, scale) {
    if (scale === 1) return text;
    return text.replace(/(~?)(\d+(?:\.\d+)?)\s*(kg|g|ml|l|tbsp|tsp|cup|cups)\b/gi, (match, tilde, numStr, unit) => {
      const num = parseFloat(numStr);
      const unitLower = unit.toLowerCase();
      let scaled = num * scale;
      let outUnit = unitLower;

      if (unitLower === 'kg') { scaled *= 1000; outUnit = 'g'; }
      else if (unitLower === 'l') { scaled *= 1000; outUnit = 'ml'; }

      let display;
      if (outUnit === 'g' || outUnit === 'ml') {
        display = roundGrams(scaled);
      } else {
        const rounded = Math.round(scaled * 4) / 4;
        display = Number.isInteger(rounded) ? String(rounded) : String(rounded);
      }

      return tilde + display + outUnit;
    });
  }

  async function deleteRecipe() {
    if (!editingId) return;
    if (!confirm('Delete this recipe?')) return;

    const isSeed = SEED_RECIPES.some(s => s.id === editingId);

    recipes = recipes.filter(r => r.id !== editingId);

    if (isSeed) {
      let deletedSeeds = [];
      try {
        const result = await window.storage.get(DELETED_SEEDS_KEY);
        if (result && result.value) deletedSeeds = JSON.parse(result.value);
      } catch (e) {}
      if (!deletedSeeds.includes(editingId)) {
        deletedSeeds.push(editingId);
        try { await window.storage.set(DELETED_SEEDS_KEY, JSON.stringify(deletedSeeds)); } catch (e) {}
      }
    }

    if (activeId === editingId) {
      activeId = recipes[0]?.id || null;
      activeServings = recipes[0]?.servings || 4;
    }
    await saveAllRecipes();
    closeModal();
    renderSidebar();
    renderMain();
  }

  function ingredientsToText(groups) {
    return groups.map(g => {
      const header = g.name ? g.name + ':\n' : '';
      const items = g.items.map(i => {
        const amt = i.unit ? `${i.amount}${i.unit === 'handful' ? ' ' : ''}${i.unit}` : i.amount;
        return `${amt} ${i.name}`;
      }).join('\n');
      return header + items;
    }).join('\n');
  }

  function methodToText(method) {
    return method.map(s => `${s.title} | ${s.body.replace(/<strong>|<\/strong>|<em>|<\/em>/g, '')}`).join('\n');
  }

  function parseIngredients(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const groups = [];
    let current = { name: '', items: [] };

    lines.forEach(line => {
      if (line.endsWith(':')) {
        if (current.items.length > 0) groups.push(current);
        current = { name: line.slice(0, -1), items: [] };
      } else {
        const match = line.match(/^([\d./]+)\s*(g|kg|ml|l|tbsp|tsp|cup|cups|handful|whole|small|medium|large)?\s+(.+)$/i);
        if (match) {
          current.items.push({
            amount: match[1],
            unit: (match[2] || '').toLowerCase(),
            name: match[3]
          });
        } else {
          current.items.push({ amount: '', unit: '', name: line });
        }
      }
    });

    if (current.items.length > 0) groups.push(current);
    if (groups.length === 0) groups.push({ name: '', items: [] });
    return groups;
  }

  function parseMethod(text) {
    return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
      const idx = line.indexOf('|');
      if (idx === -1) {
        return { title: 'Step', body: line };
      }
      return {
        title: line.slice(0, idx).trim(),
        body: line.slice(idx + 1).trim()
      };
    });
  }

  function parseSubstitutes(text) {
    return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
      const match = line.match(/^(.+?)\s*(?:->|→|=>)\s*(.+)$/);
      if (match) {
        return { from: match[1].trim(), to: match[2].trim() };
      }
      return null;
    }).filter(Boolean);
  }

  function substitutesToText(subs) {
    return subs.map(s => `${s.from} -> ${s.to}`).join('\n');
  }

  async function saveRecipe() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { alert('Please add a title'); return; }

    const data = {
      id: editingId || 'r-' + Date.now(),
      titlePlain: title,
      description: document.getElementById('f-description').value.trim(),
      servings: parseInt(document.getElementById('f-servings').value) || 4,
      time: parseInt(document.getElementById('f-time').value) || 40,
      calories: parseInt(document.getElementById('f-calories').value) || null,
      protein: parseFloat(document.getElementById('f-protein').value) || null,
      carbs: parseFloat(document.getElementById('f-carbs').value) || null,
      fat: parseFloat(document.getElementById('f-fat').value) || null,
      tags: document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean),
      ingredientGroups: parseIngredients(document.getElementById('f-ingredients').value),
      method: parseMethod(document.getElementById('f-method').value),
      substitutes: parseSubstitutes(document.getElementById('f-substitutes').value),
      notes: document.getElementById('f-notes').value.trim()
    };

    if (editingId) {
      const idx = recipes.findIndex(r => r.id === editingId);
      recipes[idx] = data;
    } else {
      recipes.push(data);
    }

    activeId = data.id;
    activeServings = data.servings;
    await saveAllRecipes();
    closeModal();
    renderSidebar();
    renderMain();
  }

  function displayNameForShopping(name) {
    let out = '';
    let depth = 0;
    for (let i = 0; i < name.length; i++) {
      const c = name[i];
      if (c === '(') depth++;
      else if (c === ')') depth--;
      else if (c === ',' && depth === 0) break;
      out += c;
    }
    return out.trim();
  }

  function normalizeForMatch(name) {
    let n = name.toLowerCase().replace(/\([^)]*\)/g, '').split(',')[0].trim().replace(/\s+/g, ' ');
    n = n.replace(/^(whole|fresh|ripe|large|small|medium|extra|hot|cold|dry|raw|cooked|the|hot)\s+/, '');
    return n;
  }

  function buildRecipeShoppingList(recipe, scale) {
    const citrusCounts = { lemon: 0, lime: 0, orange: 0 };
    const citrusZestSeen = { lemon: false, lime: false, orange: false };
    const items = new Map();

    recipe.ingredientGroups.forEach(g => {
      g.items.forEach(item => {
        const nameLower = item.name.toLowerCase();
        const num = parseFloat(item.amount);
        const hasNum = !isNaN(num) && item.amount !== '';
        const scaledAmount = hasNum ? num * scale : 0;

        // Citrus handling: lemon, lime, orange
        let citrus = null;
        if (/\blemon/i.test(item.name)) citrus = 'lemon';
        else if (/\blime/i.test(item.name)) citrus = 'lime';
        else if (/\borange/i.test(item.name)) citrus = 'orange';

        if (citrus) {
          const isJuice = nameLower.includes('juice');
          const isZest = nameLower.includes('zest');

          if (isZest && !isJuice) {
            // Track zest, contributes only at the end if no juice
            citrusZestSeen[citrus] = true;
          } else if (isJuice && item.unit === 'ml') {
            const mlPerFruit = citrus === 'lemon' ? 30 : citrus === 'lime' ? 20 : 70;
            citrusCounts[citrus] += scaledAmount / mlPerFruit;
          } else if (isJuice && hasNum && !item.unit) {
            citrusCounts[citrus] += scaledAmount;
          } else if (!hasNum && isJuice) {
            const match = item.name.match(/of\s+(\d+(?:\.\d+)?|\d+\/\d+)\s+/i);
            if (match) {
              let n;
              if (match[1].includes('/')) {
                const [a, b] = match[1].split('/');
                n = parseFloat(a) / parseFloat(b);
              } else {
                n = parseFloat(match[1]);
              }
              citrusCounts[citrus] += n * scale;
            } else {
              citrusCounts[citrus] += scale;
            }
          } else if (hasNum) {
            citrusCounts[citrus] += scaledAmount;
          } else {
            // Fallback like "Lemon wedges"
            citrusCounts[citrus] += scale;
          }
          return;
        }

        // Non-citrus: combine by normalized name + unit
        const cleanName = displayNameForShopping(item.name);
        const norm = normalizeForMatch(item.name);
        const key = `${norm}|${item.unit || ''}`;

        if (!items.has(key)) {
          items.set(key, {
            displayName: cleanName,
            unit: item.unit || '',
            total: 0,
            hasNum: false,
            norm
          });
        }
        const e = items.get(key);
        if (hasNum) {
          e.total += scaledAmount;
          e.hasNum = true;
        }
      });
    });

    // Dedupe: drop no-amount entries when a numeric version of the same ingredient exists
    const numericNorms = new Set();
    items.forEach(v => { if (v.hasNum) numericNorms.add(v.norm); });
    const toDelete = [];
    items.forEach((v, k) => {
      if (!v.hasNum && numericNorms.has(v.norm)) toDelete.push(k);
    });
    toDelete.forEach(k => items.delete(k));

    const result = [];

    ['lemon', 'lime', 'orange'].forEach(c => {
      let count = citrusCounts[c];
      // If only zest was mentioned (no juice or whole), assume 1 fruit
      if (count === 0 && citrusZestSeen[c]) count = scale;
      if (count > 0) {
        const n = Math.ceil(count);
        result.push({
          amount: String(n),
          name: n === 1 ? c : c + 's'
        });
      }
    });

    items.forEach(v => {
      let amount = '';
      if (v.hasNum && v.total > 0) {
        if (v.unit === 'g' || v.unit === 'ml') {
          amount = roundGrams(v.total) + v.unit;
        } else if (['tbsp', 'tsp', 'cup', 'cups'].includes(v.unit)) {
          const r = Math.round(v.total * 4) / 4;
          amount = `${r} ${v.unit}`;
        } else if (!v.unit) {
          const r = Math.round(v.total * 2) / 2;
          amount = String(r);
        } else {
          const r = Math.round(v.total * 10) / 10;
          amount = `${Number.isInteger(r) ? r : r.toFixed(1)} ${v.unit}`;
        }
      }
      result.push({ amount, name: v.displayName });
    });

    result.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    return result;
  }

  // === Inline timers ===
  const TIMER_REGEX = /\b(\d+)(?:\s*(?:to|-|–)\s*(\d+))?\s*(hours?|hrs?|h|minutes?|mins?|m|seconds?|secs?|s)\b/gi;

  function toSeconds(value, unit) {
    const u = unit.toLowerCase();
    if (/^h/.test(u)) return value * 3600;
    if (/^m/.test(u) && !/^ms/.test(u)) return value * 60;
    return value;
  }

  function injectTimers(text) {
    return text.replace(TIMER_REGEX, function(match, a, b, unit) {
      const targetVal = b ? parseInt(b) : parseInt(a);
      const seconds = toSeconds(targetVal, unit);
      if (seconds < 30) return match;
      const safeLabel = match.replace(/"/g, '&quot;');
      return '<button class="timer-btn" data-seconds="' + seconds + '" data-label="' + safeLabel + '" onclick="openTimerPopover(this, \'' + safeLabel + '\', ' + seconds + ')">' + match + '</button>';
    });
  }

  const activeTimers = {};
  let timerCounter = 0;
  let pendingTimer = null;

  function openTimerPopover(sourceBtn, label, defaultSeconds) {
    pendingTimer = { sourceBtn: sourceBtn, label: label || 'Timer' };

    document.getElementById('timerPopoverLabel').textContent = label ? ('Timer: ' + label) : 'Set timer';
    const h = Math.floor(defaultSeconds / 3600);
    const m = Math.floor((defaultSeconds % 3600) / 60);
    const s = defaultSeconds % 60;
    document.getElementById('timerH').value = h;
    document.getElementById('timerM').value = m;
    document.getElementById('timerS').value = s;

    const pop = document.getElementById('timerPopover');
    pop.classList.add('show');

    const rect = sourceBtn.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    let top = rect.bottom + 8;
    let left = rect.left;
    if (left + popRect.width > window.innerWidth - 12) {
      left = window.innerWidth - popRect.width - 12;
    }
    if (left < 12) left = 12;
    if (top + popRect.height > window.innerHeight - 12) {
      top = rect.top - popRect.height - 8;
    }
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';

    setTimeout(() => {
      const focusEl = m > 0 ? 'timerM' : (h > 0 ? 'timerH' : 'timerM');
      const el = document.getElementById(focusEl);
      el.focus();
      el.select();
    }, 50);
  }

  function closeTimerPopover() {
    document.getElementById('timerPopover').classList.remove('show');
    pendingTimer = null;
  }

  function confirmTimerStart() {
    const h = parseInt(document.getElementById('timerH').value) || 0;
    const m = parseInt(document.getElementById('timerM').value) || 0;
    const s = parseInt(document.getElementById('timerS').value) || 0;
    const total = h * 3600 + m * 60 + s;
    if (total < 1) { closeTimerPopover(); return; }

    const sourceBtn = pendingTimer ? pendingTimer.sourceBtn : null;
    const label = pendingTimer ? pendingTimer.label : 'Timer';
    startTimer(total, label, sourceBtn);
    closeTimerPopover();
  }

  function startTimer(total, label, sourceBtn) {
    const id = 't' + (++timerCounter);
    let remaining = total;

    const trayEl = document.createElement('div');
    trayEl.className = 'timer-tray-item';
    trayEl.dataset.timerId = id;
    trayEl.innerHTML = '<span class="timer-tray-label">' + label + '</span><span class="timer-tray-time">' + formatTime(remaining) + '</span><button class="timer-tray-close" onclick="cancelTimer(\'' + id + '\', event)">✕</button>';
    document.getElementById('timerTray').appendChild(trayEl);

    if (sourceBtn) {
      sourceBtn.classList.remove('done');
      sourceBtn.classList.add('running');
      sourceBtn.dataset.timerId = id;
    }

    function tick() {
      remaining--;
      if (remaining <= 0) {
        clearInterval(activeTimers[id].intervalId);
        const t = activeTimers[id];
        if (t.trayEl) {
          t.trayEl.classList.add('done');
          t.trayEl.querySelector('.timer-tray-time').textContent = 'Done';
        }
        if (t.sourceBtn) {
          t.sourceBtn.classList.remove('running');
          t.sourceBtn.classList.add('done');
          t.sourceBtn.innerHTML = 'Done';
        }
        timerFinished();
        return;
      }
      trayEl.querySelector('.timer-tray-time').textContent = formatTime(remaining);
      if (sourceBtn) sourceBtn.innerHTML = formatTime(remaining);
    }

    if (sourceBtn) sourceBtn.innerHTML = formatTime(remaining);

    activeTimers[id] = {
      intervalId: setInterval(tick, 1000),
      sourceBtn: sourceBtn,
      trayEl: trayEl,
      total: total,
      label: label
    };

    trayEl.addEventListener('click', function(e) {
      if (e.target.classList.contains('timer-tray-close')) return;
      if (trayEl.classList.contains('done')) cancelTimer(id);
    });
  }

  function cancelTimer(id, event) {
    if (event) event.stopPropagation();
    const t = activeTimers[id];
    if (!t) return;
    clearInterval(t.intervalId);
    if (t.trayEl && t.trayEl.parentNode) t.trayEl.parentNode.removeChild(t.trayEl);
    if (t.sourceBtn) {
      t.sourceBtn.classList.remove('running', 'done');
      t.sourceBtn.innerHTML = t.sourceBtn.dataset.label || 'Timer';
    }
    delete activeTimers[id];
  }

  function formatTime(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    return m + ':' + String(sec).padStart(2, '0');
  }

  // Shared audio context, primed on first user interaction so iOS doesn't block playback
  let audioCtx = null;

  function primeAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // Play a 1-sample silent buffer to unlock the context
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
    } catch (e) {}
  }

  ['touchstart', 'click', 'keydown'].forEach(evt => {
    document.addEventListener(evt, primeAudio, { once: true, passive: true });
  });

  function playBell(ctx, freq, startTime, duration, volume) {
    // Fundamental sine
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = 'sine';
    osc1.frequency.value = freq;
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    gain1.gain.setValueAtTime(0.0001, startTime);
    gain1.gain.linearRampToValueAtTime(volume, startTime + 0.015);
    gain1.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc1.start(startTime);
    osc1.stop(startTime + duration + 0.05);

    // Warmth harmonic at 2.5x, quieter
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2.5;
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    gain2.gain.setValueAtTime(0.0001, startTime);
    gain2.gain.linearRampToValueAtTime(volume * 0.35, startTime + 0.015);
    gain2.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc2.start(startTime);
    osc2.stop(startTime + duration + 0.05);
  }

  function timerFinished() {
    // Vibrate on Android (iOS Safari ignores this)
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}

    // Three descending bell notes (E5, C5, G4), overlapping, ringing out softly
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtx;
      if (ctx.state === 'suspended') ctx.resume();

      const now = ctx.currentTime;
      playBell(ctx, 659, now + 0.00, 1.4, 0.35); // E5
      playBell(ctx, 523, now + 0.55, 1.6, 0.35); // C5
      playBell(ctx, 392, now + 1.10, 2.2, 0.35); // G4
    } catch (e) {}

    // Subtle visual pulse: flash body background twice over ~1.6s
    try {
      const body = document.body;
      const originalBg = body.style.backgroundColor;
      const originalTransition = body.style.transition;
      const flashColor = 'rgba(107, 115, 65, 0.15)';

      body.style.transition = 'background-color 0.4s ease';
      body.style.backgroundColor = flashColor;

      setTimeout(() => { body.style.backgroundColor = originalBg; }, 400);
      setTimeout(() => { body.style.backgroundColor = flashColor; }, 800);
      setTimeout(() => { body.style.backgroundColor = originalBg; }, 1200);
      setTimeout(() => {
        body.style.transition = originalTransition;
        body.style.backgroundColor = originalBg;
      }, 1700);
    } catch (e) {}
  }

  document.addEventListener('click', function(e) {
    const pop = document.getElementById('timerPopover');
    if (!pop.classList.contains('show')) return;
    if (pop.contains(e.target)) return;
    if (e.target.classList && (e.target.classList.contains('timer-btn') || e.target.classList.contains('timer-start-btn'))) return;
    closeTimerPopover();
  });

  // === Cook mode ===
  let cookRecipe = null;
  let cookStepIdx = 0;
  let wakeLock = null;

  function enterCookMode(id) {
    cookRecipe = recipes.find(r => r.id === id);
    if (!cookRecipe) return;
    cookStepIdx = 0;
    document.getElementById('cookTitle').textContent = cookRecipe.titlePlain;
    document.getElementById('cookMode').classList.add('active');
    renderCookStep();
    document.addEventListener('keydown', cookKeyHandler);
  }

  function exitCookMode() {
    document.getElementById('cookMode').classList.remove('active');
    document.removeEventListener('keydown', cookKeyHandler);
    releaseWakeLock();
  }

  function cookKeyHandler(e) {
    if (e.key === 'Escape') exitCookMode();
    else if (e.key === 'ArrowRight' || e.key === ' ') cookStepChange(1);
    else if (e.key === 'ArrowLeft') cookStepChange(-1);
  }

  function cookStepChange(delta) {
    const next = cookStepIdx + delta;
    if (next < 0 || next >= cookRecipe.method.length) return;
    cookStepIdx = next;
    renderCookStep();
  }

  function renderCookStep() {
    const step = cookRecipe.method[cookStepIdx];
    const total = cookRecipe.method.length;
    const stepEl = document.getElementById('cookStep');
    stepEl.innerHTML = `
      <div class="cook-step-meta">Step ${cookStepIdx + 1} of ${total}</div>
      <div class="cook-step-title">${step.title}</div>
      <div class="cook-step-body">${injectTimers(step.body)}</div>
    `;
    document.getElementById('cookProgressFill').style.width = (((cookStepIdx + 1) / total) * 100) + '%';
    document.getElementById('cookCounter').textContent = (cookStepIdx + 1) + ' / ' + total;
    document.getElementById('cookPrev').disabled = cookStepIdx === 0;
    document.getElementById('cookNext').disabled = cookStepIdx === total - 1;
    document.getElementById('cookNext').textContent = cookStepIdx === total - 1 ? 'Done ✓' : 'Next →';
  }

  // === Screen wake lock ===
  async function toggleWakeLock() {
    const btn = document.getElementById('cookWake');
    if (wakeLock) {
      releaseWakeLock();
      return;
    }
    if (!('wakeLock' in navigator)) {
      btn.title = 'Wake lock not supported on this device';
      btn.style.opacity = '0.4';
      setTimeout(() => { btn.style.opacity = ''; }, 1500);
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      btn.classList.add('on');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
        btn.classList.remove('on');
      });
    } catch (e) {
      console.error('Wake lock failed:', e);
    }
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
    document.getElementById('cookWake').classList.remove('on');
  }

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' &&
        document.getElementById('cookMode').classList.contains('active') &&
        document.getElementById('cookWake').classList.contains('on') &&
        !wakeLock && 'wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }
  });

  function exportData() {
    const json = JSON.stringify(recipes, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'violeta-cooks-recipes.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  (async function init() {
    await loadSidebarState();
    applySidebarState();
    await loadRecipes();
    activeId = recipes[0]?.id || null;
    activeServings = recipes[0]?.servings || 4;
    renderSidebar();
    renderMain();
  })();
</script>
